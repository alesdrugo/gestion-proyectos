<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Admin - Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<main class="container my-4">
  <h2 class="mb-3">🛠 Administración de usuarios</h2>

  <!-- Filtros -->
  <form class="row g-2 mb-3" method="get" th:action="@{/admin/users}">
    <div class="col-md-4">
      <input class="form-control" name="q" placeholder="Buscar por username o email" th:value="${q}">
    </div>

    <div class="col-md-2">
      <select class="form-select" name="enabled">
        <option th:selected="${enabled == null}" value="">(Estado)</option>
        <option th:selected="${enabled == true}" value="true">Habilitado</option>
        <option th:selected="${enabled == false}" value="false">Deshabilitado</option>
      </select>
    </div>

    <div class="col-md-3">
      <select class="form-select" name="teamId">
        <option th:selected="${teamId == null}" value="">(Equipo)</option>
        <option th:each="t : ${teams}"
                th:value="${t.id}"
                th:selected="${teamId == t.id}"
                th:text="${t.name}">
        </option>
      </select>
    </div>

    <div class="col-md-2">
      <select class="form-select" name="roleName">
        <option th:selected="${roleName == null || roleName == ''}" value="">(Rol)</option>
        <option th:selected="${roleName == 'ROLE_USER'}" value="ROLE_USER">USER</option>
        <option th:selected="${roleName == 'ROLE_MANAGER'}" value="ROLE_MANAGER">MANAGER</option>
        <option th:selected="${roleName == 'ROLE_ADMIN'}" value="ROLE_ADMIN">ADMIN</option>
      </select>
    </div>

    <div class="col-md-1 d-grid">
      <button class="btn btn-primary">Filtrar</button>
    </div>
  </form>

  <!-- Tabla -->
  <div class="card shadow-sm">
    <div class="card-body p-0">
      <div class="table-responsive">
        <table class="table table-striped align-middle mb-0">
          <thead class="table-dark">
          <tr>
            <th>ID</th>
            <th>Usuario</th>
            <th>Email</th>
            <th>Equipo</th>
            <th>Enabled</th>
            <th>Roles</th>
            <th style="width:420px">Acción</th>
          </tr>
          </thead>
          <tbody>
          <tr th:if="${usersPage.totalElements == 0}">
            <td colspan="7" class="text-center text-muted py-4">No hay resultados</td>
          </tr>

          <tr th:each="u : ${usersPage.content}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.email}"></td>
            <td th:text="${u.team != null ? u.team.name : 'PENDING'}"></td>
            <td th:text="${u.enabled}"></td>
            <td>
              <span th:each="r : ${u.roles}" class="badge bg-secondary me-1" th:text="${r.name}"></span>
            </td>

            <td>
              <form class="row g-2" method="post" th:action="@{'/admin/users/' + ${u.id} + '/assign'}">
                <div class="col-md-4">
                  <select class="form-select" name="teamId">
                    <option value="">PENDING</option>
                    <option th:each="t : ${teams}"
                            th:value="${t.id}"
                            th:selected="${u.team != null && u.team.id == t.id}"
                            th:text="${t.name}">
                    </option>
                  </select>
                </div>

                <div class="col-md-4">
                  <select class="form-select" name="roleName">
                    <option value="ROLE_USER"
                            th:selected="${u.roles != null && u.roles.?[name == 'ROLE_USER'].size() > 0}">
                      USER
                    </option>
                    <option value="ROLE_MANAGER"
                            th:selected="${u.roles != null && u.roles.?[name == 'ROLE_MANAGER'].size() > 0}">
                      MANAGER
                    </option>
                  </select>

                </div>

                <div class="col-md-2">
                  <select class="form-select" name="enabled">
                    <option th:selected="${u.enabled}" value="true">ON</option>
                    <option th:selected="${!u.enabled}" value="false">OFF</option>
                  </select>
                </div>

                <div class="col-md-2 d-grid">
                  <button class="btn btn-success">Guardar</button>
                </div>
              </form>
            </td>
          </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Paginación -->
  <div class="d-flex justify-content-between align-items-center mt-3">
    <div class="text-muted">
      Página <span th:text="${usersPage.number + 1}"></span> / <span th:text="${usersPage.totalPages}"></span>
      (Total: <span th:text="${usersPage.totalElements}"></span>)
    </div>
    <div class="btn-group">
      <a class="btn btn-outline-secondary"
         th:href="@{/admin/users(page=${usersPage.number - 1}, q=${q}, enabled=${enabled}, teamId=${teamId}, roleName=${roleName})}"
         th:classappend="${usersPage.first} ? ' disabled' : ''">Anterior</a>
      <a class="btn btn-outline-secondary"
         th:href="@{/admin/users(page=${usersPage.number + 1}, q=${q}, enabled=${enabled}, teamId=${teamId}, roleName=${roleName})}"
         th:classappend="${usersPage.last} ? ' disabled' : ''">Siguiente</a>
    </div>
  </div>

</main>
</body>
</html>
