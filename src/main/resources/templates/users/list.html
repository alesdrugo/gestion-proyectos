<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Usuarios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
  <h3 class="mb-3">👥 Gestión de Usuarios</h3>

  <table class="table table-striped table-bordered align-middle">
    <thead class="table-dark">
      <tr>
        <th>ID</th>
        <th>Usuario</th>
        <th>Email</th>
        <th>Activo</th>
        <th>Acciones</th>
      </tr>
    </thead>
    <tbody>
      <tr th:each="u : ${users}">
        <td th:text="${u.id}"></td>
        <td th:text="${u.username}"></td>
        <td th:text="${u.email}"></td>
        <td>
          <span th:text="${u.enabled} ? 'Sí' : 'No'"
                th:classappend="${u.enabled} ? 'text-success' : 'text-danger'"></span>
        </td>
        <td>
          <a class="btn btn-sm btn-primary" th:href="@{'/users/edit/' + ${u.id}}">Editar</a>
          <a class="btn btn-sm btn-danger" th:href="@{'/users/delete/' + ${u.id}}"
             onclick="return confirm('¿Eliminar este usuario?');">Eliminar</a>
        </td>
      </tr>
    </tbody>
  </table>
</div>
</body>
</html>
