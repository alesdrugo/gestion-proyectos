<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Editar Usuario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 520px;">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h4 class="mb-3">Editar Usuario</h4>

      <form th:action="@{'/users/update/' + ${user.id}}" method="post" th:object="${user}">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input class="form-control" type="text" th:field="*{username}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" th:field="*{email}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña (dejar vacío para no cambiar)</label>
          <input class="form-control" type="password" th:field="*{password}">
        </div>

        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabled">
          <label class="form-check-label" for="enabled">Activo</label>
        </div>

        <div class="d-grid">
          <button class="btn btn-primary" type="submit">Guardar cambios</button>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
