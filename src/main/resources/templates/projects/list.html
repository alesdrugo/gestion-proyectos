<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Proyectos</title>
</head>
<body>
<h1>Gestión de Proyectos</h1>

<a th:href="@{/projects/new}">+ Nuevo proyecto</a>

<table border="1" cellpadding="5">
    <thead>
        <tr>
            <th>ID</th>
            <th>Nombre</th>
            <th>Descripción</th>
            <th>Estado</th>
            <th>Acciones</th>
        </tr>
    </thead>
    <tbody>
        <tr th:if="${#lists.isEmpty(projects)}">
            <td colspan="5">No hay proyectos registrados</td>
        </tr>
        <tr th:each="project : ${projects}">
            <td th:text="${project.id}"></td>
            <td th:text="${project.name}"></td>
            <td th:text="${project.description}"></td>
            <td th:text="${project.status}"></td>
            <td>
                <a th:href="@{'/tasks/' + ${project.id}}">Ver tareas</a> |
                <a th:href="@{'/projects/delete/' + ${project.id}}">Eliminar</a>
            </td>
        </tr>
    </tbody>
</table>

</body>
</html>
