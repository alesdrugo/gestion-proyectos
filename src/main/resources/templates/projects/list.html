<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Gestión de Proyectos</title>
  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container my-4">
    <!-- Cabecera de página -->
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-primary mb-0">📁 Área de Proyectos</h2>

      <!-- Botón para nuevo proyecto (solo admin) -->
      <div th:if="${isAdmin}">
        <a th:href="@{/projects/new}" class="btn btn-success">
          ➕ Nuevo proyecto
        </a>
      </div>
    </div>

    <!-- Tabla de proyectos -->
    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover table-striped align-middle mb-0">
            <thead class="table-dark text-center">
              <tr>
                <th style="width:80px">ID</th>
                <th style="width:240px">Nombre</th>
                <th>Descripción</th>
                <th style="width:150px">Estado</th>
                <th style="width:260px">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <!-- Si no hay proyectos -->
              <tr th:if="${#lists.isEmpty(projects)}">
                <td colspan="5" class="text-center text-muted py-4">
                  No hay proyectos registrados
                </td>
              </tr>

              <!-- Listado de proyectos -->
              <tr th:each="project : ${projects}">
                <td class="text-center" th:text="${project.id}">1</td>
                <td th:text="${project.name}">Nombre</td>
                <td th:text="${project.description}">Descripción</td>
                <td class="text-center">
                  <span
                    th:classappend="${project.status} == 'En curso' ? 'badge bg-warning text-dark' :
                                    (${project.status} == 'Completado' ? 'badge bg-success' : 'badge bg-secondary')"
                    th:text="${project.status}">
                    Estado
                  </span>
                </td>
                <td class="text-center">
                  <a th:href="@{'/tasks/' + ${project.id}}" class="btn btn-sm btn-outline-primary me-1">
                    📋 Ver tareas
                  </a>

                  <span th:if="${isAdmin}">
                    <a th:href="@{'/projects/edit/' + ${project.id}}" class="btn btn-sm btn-outline-warning me-1">
                      ✏️ Editar
                    </a>
                    <a th:href="@{'/projects/delete/' + ${project.id}}"
                       class="btn btn-sm btn-outline-danger"
                       onclick="return confirm('¿Seguro que deseas eliminar este proyecto?')">
                      🗑 Eliminar
                    </a>
                  </span>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>

  <!-- Bootstrap JS -->
  <!--script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script-->
</body>
</html>
