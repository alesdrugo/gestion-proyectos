<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${project.id} != null ? 'Editar proyecto' : 'Nuevo proyecto'">Proyecto</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-primary mb-0"
          th:text="${project.id} != null ? '✏️ Editar proyecto' : '➕ Crear nuevo proyecto'"></h2>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <form th:action="${project.id} != null ? @{'/projects/update/' + ${project.id}} : @{/projects}"
              th:object="${project}" method="post">

          <!-- Nombre -->
          <div class="mb-3">
            <label for="name" class="form-label">Nombre del proyecto</label>
            <input id="name" type="text" th:field="*{name}" class="form-control" required />
          </div>

          <!-- Descripción -->
          <div class="mb-3">
            <label for="description" class="form-label">Descripción</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
          </div>

          <!-- Estado -->
          <div class="mb-3">
            <label for="status" class="form-label">Estado</label>
            <select id="status" th:field="*{status}" class="form-select">
              <option value="Pendiente">Pendiente</option>
              <option value="En curso">En curso</option>
              <option value="Completado">Completado</option>
            </select>
          </div>

          <!-- Botones -->
          <div class="d-flex justify-content-between mt-4">
            <a th:href="@{/projects}" class="btn btn-secondary">← Volver</a>
            <button type="submit" class="btn btn-primary">💾 Guardar</button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!--script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script-->
</body>
</html>
