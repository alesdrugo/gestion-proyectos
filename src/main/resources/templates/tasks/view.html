<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="'Tarea #' + ${task.taskNumber}"></title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="/projects">Gestión de Proyectos</a>
    <div class="d-flex">
      <a class="btn btn-outline-light btn-sm" th:href="@{'/tasks/' + ${task.project.id}}">Volver a tareas</a>
    </div>
  </div>
</nav>

<div class="container my-4">
  <h3 class="mb-3" th:text="${task.title}">Tarea</h3>
  <p class="text-muted" th:text="${task.description}">Descripción</p>

  <div class="mb-3">
    <span class="badge" th:classappend="${task.completed} ? 'bg-success' : 'bg-warning text-dark'"
          th:text="${task.completed ? 'Completada' : 'Pendiente'}"></span>
    <span class="ms-2">Asignada a: <strong th:text="${task.assignedUser != null ? task.assignedUser.username : '-'}"></strong></span>
    <span class="ms-2">Fecha límite: <strong th:text="${task.dueDate != null ? task.dueDate : '-'}"></strong></span>
  </div>

  <div class="mb-4" th:if="${task.attachmentPath != null}">
    <a class="btn btn-outline-primary btn-sm" th:href="@{${task.attachmentPath}}" target="_blank">📎 Ver documento</a>
  </div>

  <div class="row g-3">
    <div class="col-md-7">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h5 class="card-title mb-3">💬 Comentarios</h5>
          <div th:if="${#lists.isEmpty(comments)}" class="text-muted">No hay comentarios aún.</div>
          <div th:each="c : ${comments}" class="mb-3 pb-3 border-bottom">
            <div class="small text-muted">
              <strong th:text="${c.author.username}">user</strong>
              · <span th:text="${#temporals.format(c.createdAt, 'dd/MM/yyyy HH:mm')}">fecha</span>
            </div>
            <div th:text="${c.text}"></div>
          </div>
        </div>
      </div>
    </div>

    <div class="col-md-5">
      <div class="card border-0 shadow-sm">
        <div class="card-body">
          <h6 class="card-title">➕ Añadir comentario</h6>
          <form th:action="@{'/task/' + ${task.id} + '/comment'}" method="post" th:object="${newComment}">
            <textarea class="form-control mb-2" th:field="*{text}" rows="3" required placeholder="Escribe tu comentario..."></textarea>
            <div class="text-end">
              <button class="btn btn-primary btn-sm" type="submit">Publicar</button>
            </div>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>
</body>
</html>
