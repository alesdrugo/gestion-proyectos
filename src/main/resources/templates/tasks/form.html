<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title th:text="${task.id} != null ? 'Editar tarea' : 'Nueva tarea'">Tarea</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script>
    function validarFecha() {
      const fecha = document.getElementById("dueDate").value;
      const hoy = new Date().toISOString().split("T")[0];
      if (fecha && fecha < hoy) {
        alert("⚠️ La fecha límite no puede ser anterior a hoy.");
        return false;
      }
      return true;
    }
  </script>
</head>
<body class="bg-light">

  
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="text-primary mb-0"
          th:text="${task.id} != null ?
                   '✏️ Editar tarea de: ' + ${project.name} :
                   '➕ Añadir tarea al proyecto: ' + ${project.name}"></h2>
    </div>

    <div class="card shadow-sm">
      <div class="card-body">
        <form th:action="${task.id} != null ? @{'/tasks/update/' + ${task.id}} : @{'/tasks/add/' + ${project.id}}"
              th:object="${task}" method="post" enctype="multipart/form-data"
              onsubmit="return validarFecha()">

          <input type="hidden" th:field="*{project.id}" />

          <!-- Título -->
          <div class="mb-3">
            <label for="title" class="form-label">Título</label>
            <input id="title" type="text" th:field="*{title}" class="form-control" required />
          </div>

          <!-- Descripción -->
          <div class="mb-3">
            <label for="description" class="form-label">Descripción</label>
            <textarea id="description" th:field="*{description}" class="form-control" rows="4"></textarea>
          </div>

          <!-- Fecha límite -->
          <div class="mb-3">
            <label for="dueDate" class="form-label">Fecha límite</label>
            <input id="dueDate" type="date" th:field="*{dueDate}" class="form-control" />
          </div>

          <!-- Estado -->
          <div class="form-check mb-3">
            <input id="completed" type="checkbox" th:field="*{completed}" class="form-check-input" />
            <label for="completed" class="form-check-label">Completada</label>
          </div>

          <!-- Asignar usuario (solo admin) -->
          <div th:if="${isAdmin}" class="mb-3">
            <label for="assignedUser" class="form-label">Asignar a usuario</label>
            <select id="assignedUser" name="assignedUser.id" th:field="*{assignedUser.id}" class="form-select">
              <option th:each="u : ${users}" th:value="${u.id}" th:text="${u.username}"></option>
            </select>
          </div>

          <!-- Subir archivo -->
          <div class="mb-3">
            <label for="file" class="form-label">Adjuntar documento</label>
            <input id="file" type="file" name="file" class="form-control"
                   accept=".pdf,.doc,.docx,.jpg,.png,.txt" />
          </div>

          <!-- Archivo actual -->
          <div th:if="${task.attachmentPath != null}" class="mb-3">
            <strong>Archivo actual:</strong>
            <a th:href="@{${task.attachmentPath}}" target="_blank"
               th:text="${#strings.substringAfter(task.attachmentPath, '/')}"></a>
          </div>

          <!-- Botones -->
          <div class="d-flex justify-content-between mt-4">
            <a th:href="@{'/tasks/' + ${project.id}}" class="btn btn-secondary">← Volver</a>
            <button type="submit" class="btn btn-primary" th:text="${task.id} != null ? '💾 Guardar cambios' : '✅ Guardar tarea'">Guardar
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <!--script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script-->
</body>
</html>
