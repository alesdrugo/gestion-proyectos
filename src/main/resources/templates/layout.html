<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title th:text="${title} ?: 'Gestión de Proyectos'"></title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    footer {
      margin-top: auto;
      background: #212529;
      color: #ccc;
      text-align: center;
      padding: 10px 0;
      font-size: 0.9rem;
    }

    .navbar-brand {
      font-weight: 600;
    }
  </style>
</head>

<body>
  <!-- 🔹 Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
    <div class="container-fluid">
      <a class="navbar-brand" href="/projects">Gestión de Proyectos</a>

      <div class="d-flex align-items-center" th:if="${session != null}">
        <span class="navbar-text text-white me-3">
          👤 <strong th:text="${session.username}">usuario</strong>
          (<span th:text="${session.isAdmin} ? 'Administrador' : 'Usuario'"></span>)
        </span>
        <a class="btn btn-outline-light btn-sm" href="/logout">Cerrar sesión</a>
      </div>
    </div>
  </nav>

  <!-- 🔹 Contenido de las vistas -->
  <main class="container my-4" th:fragment="layout(content)">
    <th:block th:replace="${content}"></th:block>
  </main>

  <!-- 🔹 Footer -->
  <footer>
    <div class="container">
      © 2025 – Gestión de Proyectos | Desarrollado por Alejandro
    </div>
  </footer>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
