<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light d-flex align-items-center" style="min-height: 100vh;">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">

            <h3 class="text-center text-primary mb-4">📝 Registro de nuevo usuario</h3>

            <form action="/register" method="post">
              <!-- Usuario -->
              <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" placeholder="Introduce tu nombre de usuario" required>
              </div>

              <!-- Contraseña -->
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
              </div>

              <!-- Botón -->
              <div class="d-grid">
                <button type="submit" class="btn btn-success">Registrar</button>
              </div>
            </form>

            <!-- Mensaje de éxito -->
            <div th:if="${success}" class="alert alert-success mt-3" th:text="${success}"></div>

            <!-- Mensaje de error -->
            <div th:if="${error}" class="alert alert-danger mt-3" th:text="${error}"></div>

            <!-- Enlace a login -->
            <p class="text-center mt-4 mb-0">
              ¿Ya tienes cuenta?
              <a th:href="@{/login}" class="text-decoration-none">Inicia sesión aquí</a>
            </p>

          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
