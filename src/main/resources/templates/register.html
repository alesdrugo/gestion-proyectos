<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Registro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
  <div class="container-fluid">
    <a class="navbar-brand" href="/dashboard">Gestión de Proyectos</a>
    <div class="d-flex">
      <a class="btn btn-outline-light btn-sm" href="/login">Iniciar sesión</a>
    </div>
  </div>
</nav>

<div class="container mt-4" style="max-width: 520px;">
  <div class="card shadow-sm border-0">
    <div class="card-body">
      <h4 class="mb-3">Crear cuenta</h4>

      <!-- Mensajes -->
      <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
      <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>

      <!-- IMPORTANTE: th:object -->
      <form th:action="@{/register}" method="post" th:object="${user}">
        <div class="mb-3">
          <label class="form-label">Usuario</label>
          <input class="form-control" type="text" th:field="*{username}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input class="form-control" type="email" th:field="*{email}" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Contraseña</label>
          <input class="form-control" type="password" th:field="*{password}" required>
        </div>

        <div class="d-grid">
          <button class="btn btn-primary" type="submit">Registrar</button>
        </div>
      </form>

      <div class="mt-3 text-center">
        <a href="/login">¿Ya tienes cuenta? Inicia sesión</a>
      </div>
    </div>
  </div>
</div>

</body>
</html>
