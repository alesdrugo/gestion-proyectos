<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="bg-light">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <div class="container my-4">
    <h3 class="mb-4">📊 Resumen</h3>

    <div class="row g-3">
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="text-muted">Proyectos</div>
            <div class="fs-3 fw-semibold" th:text="${totalProjects}">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="text-muted">Tareas</div>
            <div class="fs-3 fw-semibold" th:text="${totalTasks}">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="text-muted">Pendientes</div>
            <div class="fs-3 fw-semibold text-warning" th:text="${pendingTasks}">0</div>
          </div>
        </div>
      </div>
      <div class="col-md-3">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <div class="text-muted">Vencidas</div>
            <div class="fs-3 fw-semibold text-danger" th:text="${overdueTasks}">0</div>
          </div>
        </div>
      </div>
    </div>

    <div class="card mt-4 border-0 shadow-sm">
      <div class="card-body">
        <h5 class="card-title">Distribución de tareas</h5>
        <canvas id="tasksChart" height="100"></canvas>
      </div>
    </div>
  </div>
  <div class="card mt-4 border-0 shadow-sm">
  <div class="card-body">
    <h5 class="card-title">📅 Mis próximas tareas</h5>

    <table class="table table-sm align-middle">
      <thead>
        <tr>
          <th>Proyecto</th>
          <th>Título</th>
          <th>Fecha límite</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="t : ${upcomingTasks}">
          <td th:text="${t.project.name}"></td>
          <td th:text="${t.title}"></td>
          <td th:text="${#temporals.format(t.dueDate, 'dd/MM/yyyy')}"></td>
          <td>
            <span th:if="${t.completed}" class="badge bg-success">✅ Hecha</span>
            <span th:unless="${t.completed}" class="badge bg-warning text-dark">⏳ Pendiente</span>
          </td>
        </tr>
        <tr th:if="${#lists.isEmpty(upcomingTasks)}">
          <td colspan="4" class="text-center text-muted">No tienes tareas próximas.</td>
        </tr>
      </tbody>
    </table>

    <div class="text-end">
      <a href="/projects" class="btn btn-sm btn-outline-primary">Ver todos los proyectos →</a>
    </div>
  </div>
</div>
  <script th:inline="javascript">
    const labels = /*[[${chartLabels}]]*/ ["Pendientes","Completadas","Vencidas"];
    const data = /*[[${chartData}]]*/ [0,0,0];

    new Chart(document.getElementById('tasksChart'), {
      type: 'doughnut',
      data: {
        labels: labels,
        datasets: [{ data: data }]
      }
    });
  </script>
</body>
</html>
