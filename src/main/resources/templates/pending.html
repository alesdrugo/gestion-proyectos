<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8"/>
  <title>Pendiente de asignación</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
</head>
<body class="bg-light">
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container my-4">
    <div class="alert alert-warning shadow-sm">
      <h4 class="mb-2">Cuenta pendiente de asignación</h4>
      <p class="mb-0">
        Tu cuenta está registrada, pero aún no has sido asignado a un equipo y/o rol.
        Contacta con el administrador para completar el alta.
      </p>
    </div>
  </main>
</body>
</html>
