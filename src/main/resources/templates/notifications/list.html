<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Notificaciones</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">

  <!-- Navbar común -->
  <div th:replace="~{fragments/navbar :: navbar}"></div>

  <main class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">🔔 Notificaciones</h2>
      <div class="d-flex align-items-center">
        <span class="badge bg-primary me-3"
              th:text="'No leídas: ' + ${unreadCount}">No leídas: 0</span>
        <a class="btn btn-sm btn-outline-secondary" href="/notifications/mark-all">
          Marcar todas como leídas
        </a>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
              <tr>
                <th style="width: 160px;">Fecha</th>
                <th>Mensaje</th>
                <th style="width: 160px;">Estado</th>
                <th style="width: 160px;">Acciones</th>
              </tr>
            </thead>
            <tbody>
              <tr th:if="${#lists.isEmpty(notifications)}">
                <td colspan="4" class="text-center text-muted py-4">
                  No tienes notificaciones.
                </td>
              </tr>

              <tr th:each="n : ${notifications}">
                <td th:text="${#temporals.format(n.createdAt, 'yyyy-MM-dd HH:mm')}">2025-11-10 12:00</td>

                <td>
                  <a th:if="${n.link != null}" th:href="@{${n.link}}" th:text="${n.message}">Mensaje</a>
                  <span th:if="${n.link == null}" th:text="${n.message}">Mensaje</span>
                </td>

                <td>
                  <span th:classappend="${!n.read} ? 'badge bg-warning text-dark' : 'badge bg-success'"
                        th:text="${n.read} ? 'Leída' : 'No leída'">No leída</span>
                </td>

                <td>
                  <a class="btn btn-sm btn-outline-primary"
                     th:href="@{'/notifications/read/' + ${n.id}}">Marcar leída</a>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="mt-3">
      <a href="/dashboard" class="btn btn-outline-secondary btn-sm">← Volver al dashboard</a>
    </div>
  </main>

  <!--script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script-->
</body>
</html>
