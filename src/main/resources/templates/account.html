<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <title>Mi perfil</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

  <style>
    
    .toast-container {
      position: fixed;
      top: 1rem;
      right: 1rem;
      z-index: 1080; 
    }
  </style>
</head>
<body class="bg-light">

  <div th:replace="~{fragments/navbar :: navbar}"></div>

  
  <div class="toast-container">
    
    <div class="toast align-items-center text-bg-success border-0"
         role="alert" aria-live="assertive" aria-atomic="true"
         th:if="${successProfile}">
      <div class="d-flex">
        <div class="toast-body" th:text="${successProfile}">Perfil actualizado correctamente.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>

    <!-- Perfil ERROR -->
    <div class="toast align-items-center text-bg-danger border-0"
         role="alert" aria-live="assertive" aria-atomic="true"
         th:if="${errorProfile}">
      <div class="d-flex">
        <div class="toast-body" th:text="${errorProfile}">Error al actualizar el perfil.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>

    <!-- Password OK -->
    <div class="toast align-items-center text-bg-success border-0"
         role="alert" aria-live="assertive" aria-atomic="true"
         th:if="${successPassword}">
      <div class="d-flex">
        <div class="toast-body" th:text="${successPassword}">Contraseña actualizada correctamente.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>

    <!-- Password ERROR -->
    <div class="toast align-items-center text-bg-danger border-0"
         role="alert" aria-live="assertive" aria-atomic="true"
         th:if="${errorPassword}">
      <div class="d-flex">
        <div class="toast-body" th:text="${errorPassword}">La contraseña actual no es correcta.</div>
        <button type="button" class="btn-close btn-close-white me-2 m-auto"
                data-bs-dismiss="toast" aria-label="Close"></button>
      </div>
    </div>
  </div>

  <main class="container my-4">
    <h3 class="mb-4">⚙️ Mi perfil</h3>

    <div class="row g-4">
      <!-- Datos básicos -->
      <div class="col-md-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">👤 Datos de cuenta</h5>

            <form method="post" th:action="@{/account}" class="mt-3">
              <div class="mb-3">
                <label class="form-label">Nombre de usuario</label>
                <input type="text" name="username" class="form-control"
                       th:value="${me.username}" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control"
                       th:value="${me.email}" required />
              </div>
              <div class="text-end">
                <button class="btn btn-primary">Guardar cambios</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Cambiar contraseña -->
      <div class="col-md-6">
        <div class="card border-0 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">🔒 Cambiar contraseña</h5>

            <form method="post" th:action="@{/account/password}" class="mt-3">
              <div class="mb-3">
                <label class="form-label">Contraseña actual</label>
                <input type="password" name="currentPassword" class="form-control" required />
              </div>
              <div class="mb-3">
                <label class="form-label">Nueva contraseña</label>
                <input type="password" name="newPassword" class="form-control" minlength="6" required />
                <div class="form-text">Mínimo 6 caracteres.</div>
              </div>
              <div class="mb-3">
                <label class="form-label">Confirmar nueva contraseña</label>
                <input type="password" name="confirmPassword" class="form-control" minlength="6" required />
              </div>
              <div class="text-end">
                <button class="btn btn-warning">Actualizar contraseña</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Inicializar toasts al cargar (usa el bundle ya incluido en el navbar) -->
  <script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function () {
      // Activa todos los toasts presentes
      document.querySelectorAll('.toast').forEach(function (toastEl) {
        // Auto-hide con retraso estándar
        var t = new bootstrap.Toast(toastEl, { delay: 4000, autohide: true });
        t.show();
      });
    });
  </script>
</body>
</html>
